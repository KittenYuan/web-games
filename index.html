<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页游戏作品集</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --text: #e6edf3;
            --muted: #8b949e;
            --pink: #ff8fab;
            --cyan: #7dd3fc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            background: radial-gradient(circle at top, #1f2a44 0%, var(--bg) 45%);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 20px 64px;
        }
        h1 { font-size: 2rem; letter-spacing: 0.08em; margin-bottom: 8px; }
        .subtitle { color: var(--muted); margin-bottom: 40px; }
        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            width: min(860px, 100%);
        }
        a.card {
            display: block;
            background: var(--card);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 28px 24px 24px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        a.card:hover { transform: translateY(-6px); }
        .card.cat:hover { border-color: var(--pink); }
        .card.nostalgia:hover { border-color: var(--cyan); }
        .tag {
            display: inline-block;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 14px;
        }
        .cat .tag { background: rgba(255, 143, 171, 0.15); color: var(--pink); }
        .nostalgia .tag { background: rgba(125, 211, 252, 0.15); color: var(--cyan); }
        h2 { font-size: 1.4rem; margin-bottom: 10px; }
        p { color: var(--muted); line-height: 1.6; font-size: 0.95rem; }
        .play { margin-top: 18px; font-weight: 700; }
        .cat .play { color: var(--pink); }
        .nostalgia .play { color: var(--cyan); }
        footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
    </style>
</head>
<body>
    <h1>网页游戏作品</h1>
    <p class="subtitle">点击卡片即可在线游玩 · 建议使用 Chrome / Edge</p>
    <div class="games">
        <a class="card cat" href="xinyu-miaowu/index.html">
            <span class="tag">治愈互动</span>
            <h2>心语喵屋</h2>
            <p>与猫导师对话、整理小情绪，在探索中收集心灵碎片，最终生成一只专属的心灵伙伴小猫。</p>
            <div class="play">进入游戏 →</div>
        </a>
        <a class="card nostalgia" href="digital-nostalgia/《记忆碎片：数字乡愁》.html">
            <span class="tag">收集冒险</span>
            <h2>记忆碎片：数字乡愁</h2>
            <p>在数字世界中收集记忆碎片。可用方向键或 WASD 移动角色，完成小游戏并推进剧情。</p>
            <div class="play">进入游戏 →</div>
        </a>
    </div>
    <footer>作品仅供作品集展示，建议在电脑端打开以获得完整体验。</footer>
</body>
</html>
